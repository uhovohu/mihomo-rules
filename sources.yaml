# 成品清单：每个成品一行，顺序 = 配置里规则的顺序（master-table.md）
#   {}                      上游同名原样（有 add/remove 文件自动合）
#   from                    上游取哪个文件（默认 = 成品名）
#   minus                   减掉哪些成品的最终结果
#   own: true               own/<类>/<名>.yaml 全文
#   collection: true        合集：再自动减掉所有非合集成品（except 里列的不减）
#   fallback: true          兜底：不参与合集自动减、不参与重叠检查
#   check: false            有意跟别人重叠的，不参与重叠检查
#   lite: true              上游在 geo-lite 目录（不在 geo）
#   url                     别的上游，mrs 原样转发

geosite:
