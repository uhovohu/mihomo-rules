name: cleanup

on:
  schedule:
    - cron: "0 0 * * 0"   # 每周一次
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 删 7 天前的运行记录
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '7 days ago' +%FT%TZ)
          gh api --paginate "repos/${{ github.repository }}/actions/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.created_at < \"$cutoff\") | .id" |
          while read -r id; do gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id"; done
