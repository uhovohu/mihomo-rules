name: build

on:
  schedule:
    - cron: "30 23 * * *"   # 北京时间 7:30
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "允许这次条数大减的成品（逗号分隔，如 geosite/xxx）"
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 取上一版（70% 检查用）
        run: git fetch --depth 1 origin meta && git worktree add prev FETCH_HEAD || mkdir -p prev/geo

      - name: 准备 PyYAML 和 mihomo
        run: |
          pip install pyyaml
          curl -sfL https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1.19.32.gz | gunzip > mihomo
          chmod +x mihomo

      - name: 生成
        env:
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}
        run: python3 scripts/build.py --out out --prev prev/geo --mihomo ./mihomo --allow-shrink "${{ inputs.allow_shrink }}"

      - name: 强推到 meta 分支（只留一次提交）
        run: |
          cd out
          git init -q -b meta
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "$(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" meta
